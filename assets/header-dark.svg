<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 80" preserveAspectRatio="xMinYMid slice" role="img" aria-label="Rafael Nobre">
  <!-- The CV's header rule, drawn as an index of chunks; each cycle retrieves a different top five.
       Shown at a fixed 80px height, so narrow screens crop the rule instead of shrinking the name. -->
  <style>
    .name { font: 800 40px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: .6px; fill: #F0F6FC }
    .hit { fill: #67B2F4; opacity: 0; transform-box: fill-box; transform-origin: center; animation: retrieve 15s infinite }
    .q2 { animation-delay: -10s }
    .q3 { animation-delay: -5s }
    @keyframes retrieve {
      0%, 26% { opacity: 1; transform: scaleY(1.8) }
      31%, 95% { opacity: 0; transform: scaleY(1) }
      100% { opacity: 1; transform: scaleY(1.8) }
    }
    @media (max-width: 340px) { .name { font-size: 34px } }
    @media (max-width: 275px) { .name { font-size: 30px } }
    @media (prefers-reduced-motion: reduce) {
      .hit { animation: none }
      .q1 { opacity: 1; transform: scaleY(1.8) }
    }
  </style>
  <defs>
    <pattern id="chunks" width="5" height="10" patternUnits="userSpaceOnUse">
      <rect width="2" height="10" fill="#3D444D"/>
    </pattern>
  </defs>
  <text class="name" x="0" y="40">RAFAEL NOBRE</text>
  <rect y="60" width="838" height="10" fill="url(#chunks)"/>
  <g class="hit q1">
    <rect x="60" y="60" width="2" height="10"/>
    <rect x="65" y="60" width="2" height="10"/>
    <rect x="235" y="60" width="2" height="10"/>
    <rect x="480" y="60" width="2" height="10"/>
    <rect x="655" y="60" width="2" height="10"/>
  </g>
  <g class="hit q2">
    <rect x="20" y="60" width="2" height="10"/>
    <rect x="150" y="60" width="2" height="10"/>
    <rect x="155" y="60" width="2" height="10"/>
    <rect x="395" y="60" width="2" height="10"/>
    <rect x="750" y="60" width="2" height="10"/>
  </g>
  <g class="hit q3">
    <rect x="105" y="60" width="2" height="10"/>
    <rect x="200" y="60" width="2" height="10"/>
    <rect x="270" y="60" width="2" height="10"/>
    <rect x="525" y="60" width="2" height="10"/>
    <rect x="810" y="60" width="2" height="10"/>
  </g>
</svg>
